name: kit-validation
# Kit-level self-check for the AIDLC harness home repository. This is NOT the instance workflow:
# harness/kit/github/workflows/harness-validation.yml validates a rendered project instance and is
# copied into every instance. This workflow validates the kit itself, which holds only templates.

on:
  pull_request:
    paths:
      - 'harness/**'
      - 'docs/harness/**'
      - 'tests/**'
      - 'site/**'
      - '.github/workflows/kit-validation.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows only for now: the renderer still addresses files with Windows separators, so rendering an
  # instance on Linux/macOS would fail for the wrong reason. The static policy and handbook jobs run on
  # all three platforms - they parse and check sources rather than write files. Converting the path
  # literals and re-enabling this matrix is tracked as open work in the handbook.
  render-and-validate:
    name: Render and validate every lifecycle profile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kit self-test (5 profiles + all-integrations variant)
        shell: pwsh
        run: ./tests/render-and-validate.ps1
      - name: Keep the rendered reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kit-self-test-${{ matrix.os }}
          path: |
            **/harness/reports/validate-*.md
          if-no-files-found: ignore

  source-policy:
    name: Static source policy
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ASCII-only sources, parse clean, slot audit, kit contract
        shell: pwsh
        run: ./tests/check-sources.ps1

  site-policy:
    name: Handbook structure and counted claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anchors, tag balance, version stamp, table counts
        shell: pwsh
        run: ./tests/check-site.ps1
